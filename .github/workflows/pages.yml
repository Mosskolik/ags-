name: GitHub Pages'e yayınla
on:
  push:
    branches: [main, claude/peaceful-volta-b4zcw9]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Yalnızca web dosyaları
        run: mkdir _site && cp -r index.html styles.css data.js mascot.js app.js manifest.webmanifest sw.js icons .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
